name: Refresh Black Friday deals

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deal-tracker-default
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Run tests
        id: tests
        run: python3 -m unittest discover -v
      - name: Retrieve and validate spreadsheet
        run: python3 tracker.py
      - name: Publish snapshot and history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/latest.json data/changes.json data/price_history.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh Black Friday deals"
          git push origin HEAD
      - name: Deliver optional deal alerts
        env:
          DEAL_ALERT_WEBHOOK: ${{ secrets.DEAL_ALERT_WEBHOOK }}
        run: python3 tracker.py --alerts-only
      - name: Retrieve and publish DealsMocktail
        id: website
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          python3 tracker.py --source dealsmocktail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/dealsmocktail/latest.json data/dealsmocktail/changes.json data/dealsmocktail/price_history.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh DealsMocktail deals"
          git push origin HEAD
      - name: Deliver optional DealsMocktail alerts
        if: ${{ !cancelled() && steps.website.outcome == 'success' }}
        env:
          DEAL_ALERT_WEBHOOK: ${{ secrets.DEAL_ALERT_WEBHOOK }}
        run: python3 tracker.py --source dealsmocktail --alerts-only
