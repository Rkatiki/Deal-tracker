name: Refresh additional deal sources

on:
  schedule:
    - cron: '47 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deal-tracker-default
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Run tests
        run: env -u GITHUB_STEP_SUMMARY python3 -m unittest discover -v
      - name: Refresh independent sources
        run: python3 extra_feeds.py
      - name: Publish snapshots and source status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/feeds/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh additional deal sources"
          git push origin HEAD
